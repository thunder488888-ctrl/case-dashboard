    .header .updated {
      font-size: 11px; opacity: 0.75;
      background: rgba(255,255,255,0.15);
      padding: 4px 10px; border-radius: 20px; white-space: nowrap;
    }

    /* ── Institution summary cards ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .card {
      background: white; border-radius: 10px;
      padding: 14px 12px 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border-top: 4px solid;
      transition: transform 0.15s;
    }
    .card:hover { transform: translateY(-2px); }
    .card .inst-name { font-size: 11px; color: #718096; font-weight: 600; line-height: 1.5; min-height: 33px; }
    .card .total { font-size: 34px; font-weight: 800; margin-top: 6px; line-height: 1; }
    .card .unit { font-size: 12px; color: #a0aec0; margin-top: 2px; }
    .card .trend {
      font-size: 11px; margin-top: 6px;
      padding: 2px 6px; border-radius: 10px; display: inline-block;
    }
    .trend-up   { background: #fef2f2; color: #e53e3e; }
    .trend-down { background: #f0fff4; color: #38a169; }
    .trend-same { background: #f7fafc; color: #718096; }

    /* ── Charts row ── */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .chart-box {
      background: white; border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .chart-box h3 {
      font-size: 13px; color: #4a5568; margin-bottom: 12px;
      font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0;
    }
    .chart-wrap { position: relative; height: 220px; }

    /* ── Supervisor detail section ── */

      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .sup-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .sup-card {
      background: white; border-radius: 10px;
      padding: 14px 14px 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border-top: 3px solid;
    }
    .sup-card .inst-label {

      margin-bottom: 10px; padding-bottom: 7px;
      border-bottom: 1px solid #e2e8f0;
    }
    .sup-table { width: 100%; border-collapse: collapse; }
    .sup-table tr { border-bottom: 1px solid #f0f4f8; }
    .sup-table tr:last-child { border-bottom: none; }
    .sup-table td {
      padding: 5px 2px;
      font-size: 11.5px;
      vertical-align: middle;
    }
    .sup-table td:first-child {
      color: #4a5568;
      width: 60%;
    }
    .sup-table td.count-cell {
      text-align: right;
      font-weight: 700;
      color: #2d3748;
      white-space: nowrap;
      width: 28px;
    }
    .sup-table td.bar-cell { width: 40%; padding-left: 6px; }
    .bar-bg {
      background: #edf2f7; border-radius: 4px; height: 6px; overflow: hidden;
    }
    .bar-fill { height: 6px; border-radius: 4px; transition: width 0.4s; }

    /* ── Supervisor district expand/collapse ── */
    .sup-table tr.sup-row.has-dist { cursor: pointer; }
    .sup-table tr.sup-row.has-dist:hover { background: #f8fafc; }
    .sup-name-cell { display: flex; align-items: center; gap: 5px; }
    .toggle-ico {
      display: inline-block; flex: 0 0 auto;
      width: 11px; font-size: 9px; color: #a0aec0;
      transition: transform 0.15s; line-height: 1;
    }
    tr.sup-row.open .toggle-ico { transform: rotate(90deg); color: #4a5568; }
    .detail-row > td { padding: 3px 2px 8px 18px !important; }
    .district-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .district-chip {
      font-size: 10.5px; background: #f1f5f9; color: #475569;
      border-radius: 10px; padding: 2px 8px; white-space: nowrap;
    }
    .district-chip b { color: #1e293b; margin-left: 3px; font-weight: 700; }

    /* ── No data ── */

    @media (max-width: 750px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
      .charts-row { grid-template-columns: 1fr; }
      .sup-grid { grid-template-columns: repeat(2, 1fr); }

    @media (max-width: 480px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }

    .bar-served { position: absolute; left: 0; top: 0; height: 7px; border-radius: 4px; transition: width 0.4s; }
    .sup-table tr.gap-big td.c-served { color: #c2410c; }
    .sup-table tr.gap-big td:first-child span:last-child { color: #9a3412; font-weight: 600; }

<script>
// ── 顏色配置 ─────────────────────────────────────────────────────────────────
const COLORS = {
  "平安居家"         : { border: "#1976d2", bg: "rgba(25,118,210,0.12)",  bar: "#1976d2" },
  "健康居家"         : { border: "#2e7d32", bg: "rgba(46,125,50,0.12)",   bar: "#2e7d32" },
  "快樂居家"         : { border: "#e65100", bg: "rgba(230,81,0,0.12)",    bar: "#e65100" },
  "惠群居家"         : { border: "#6a1b9a", bg: "rgba(106,27,154,0.12)",  bar: "#6a1b9a" },
  "臺東健康居家"     : { border: "#00838f", bg: "rgba(0,131,143,0.12)",   bar: "#00838f" },
};
const BORDER_COLORS = Object.values(COLORS).map(c => c.border);
const BG_COLORS     = Object.values(COLORS).map(c => c.bg);
const HOLD_COLOR    = "#cbd5e1";

// ── 讀取資料 ─────────────────────────────────────────────────────────────────
const { lastUpdated, history } = DASHBOARD_DATA;
const hasData = history && history.length > 0;
const latest  = hasData ? history[0] : null;
const SERVED  = (latest && latest.served) || null;

// ── 口徑（當月至今 / 上月全月）────────────────────────────────────────────────
function monthNum(key) {                       // "2026-09" → 9
  const m = /^(\d{4})-(\d{2})$/.exec(key || "");
  return m ? Number(m[2]) : null;
}
function blockOf(mode) {
  return SERVED ? SERVED[mode] : null;
}
function hasAnyValue(block) {
  if (!block || !block.institutions) return false;
  return Object.values(block.institutions).some(v => v != null);
}

const CUR = blockOf("current");
const PRE = blockOf("previous");

// 預設：每月 1~10 號看上月（當月才剛開始），之後看當月至今
let MODE = "current";
if (hasAnyValue(PRE) && (new Date().getDate() <= 10 || !hasAnyValue(CUR))) MODE = "previous";
if (!hasAnyValue(PRE) && !hasAnyValue(CUR)) MODE = "current";

function scopeLabel(mode) {
  const b = blockOf(mode);
  const mo = monthNum(b && b.month);
  if (mode === "current") {
    if (!mo) return "當月至今";
    const d = b.dayOfMonth, t = b.daysInMonth;
    return d && t ? `${mo}月至今（1–${d}日／共${t}天）` : `${mo}月至今`;
  }
  return mo ? `${mo}月全月` : "上月全月";
}

function setupSeg() {
  const seg = document.getElementById("scope-seg");
  const bc = document.getElementById("btn-current");
  const bp = document.getElementById("btn-previous");
  bc.textContent = scopeLabel("current");
  bp.textContent = scopeLabel("previous");
  bc.disabled = !hasAnyValue(CUR);
  bp.disabled = !hasAnyValue(PRE);
  seg.addEventListener("click", e => {
    const btn = e.target.closest("button[data-mode]");
    if (!btn || btn.disabled || btn.dataset.mode === MODE) return;
    MODE = btn.dataset.mode;
    syncSeg();
    renderAll();
  });
  syncSeg();
}
function syncSeg() {
  document.querySelectorAll("#scope-seg button").forEach(b => {
    b.classList.toggle("active", b.dataset.mode === MODE);
  });
  const lab = document.getElementById("sup-scope-label");
  if (lab) lab.textContent = "（實服口徑：" + scopeLabel(MODE) + "）";
}

// 目前口徑下的實服數字
function servedTotal(instName) {
  const b = blockOf(MODE);
  if (!b || !b.institutions) return null;
  const v = b.institutions[instName];
  return v == null ? null : v;
}
function servedSups(instName) {
  if (servedTotal(instName) == null) return null;   // 該機構實服未取得 → 整欄顯示「—」
  const b = blockOf(MODE);
  return (b && b.supervisors && b.supervisors[instName]) || null;
}

// ── X 軸標籤：由實際日期產生「8/27(四)」──────────────────────────────────────
const WEEKDAY_TW = ["日", "一", "二", "三", "四", "五", "六"];
function formatWeekLabel(h) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(h.week || "");
  if (!m) return h.label || h.week || "";      // 無日期時退回舊標籤
  const [, y, mo, d] = m.map(Number);
  const dow = new Date(y, mo - 1, d).getDay();
  return `${mo}/${d}(${WEEKDAY_TW[dow]})`;
}

// ── 合計：任一家缺資料則該週回傳 null（線斷開，不顯示失真數字）──────────────
const KAOHSIUNG_INSTITUTIONS = ["平安居家", "健康居家", "快樂居家"];
function sumOrNull(entry, names) {
  const inst = entry.institutions || {};
  let sum = 0;
  for (const n of names) {
    const v = inst[n];
    if (v == null) return null;
    sum += v;
  }
  return sum;
}

// ── 更新時間標籤 ─────────────────────────────────────────────────────────────
if (lastUpdated) {
  const d = new Date(lastUpdated);
  const pad = n => String(n).padStart(2, "0");
  document.getElementById("updated-label").textContent =
    `最後更新：${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ── 機構總計卡片 ─────────────────────────────────────────────────────────────
function renderCards() {
  const container = document.getElementById("cards-container");
  container.innerHTML = "";
  if (!hasData) {
    container.innerHTML = `
      <div class="no-data-msg" style="grid-column:1/-1">
        <div class="icon">📭</div>
        <p>尚無資料<br>排程任務執行後將自動更新</p>
      </div>`;
    return;
  }
  const cur       = latest.institutions;
  const prev      = history.length > 1 ? history[1].institutions : null;
  const instNames = Object.keys(cur);
  const topColors = Object.values(COLORS);

  instNames.forEach((name, i) => {
    const hold  = cur[name];
    const serv  = servedTotal(name);
    const color = topColors[i] || { border: "#718096" };

    let trendHTML = "";
    if (prev && prev[name] != null && hold != null) {
      const diff = hold - prev[name];
      if (diff > 0)      trendHTML = `<span class="trend trend-up">掛案 ▲ ${diff}</span>`;
      else if (diff < 0) trendHTML = `<span class="trend trend-down">掛案 ▼ ${Math.abs(diff)}</span>`;
      else               trendHTML = `<span class="trend trend-same">掛案 ─ 持平</span>`;
    }

    let gapHTML;
    if (serv == null || hold == null) {
      gapHTML = `<span class="gap-chip na">實服資料未取得</span>`;
    } else {
      const gap = hold - serv;
      gapHTML = gap > 0
        ? `<span class="gap-chip">有掛案未服務 ${gap} 案</span>`
        : `<span class="gap-chip zero">${gap === 0 ? "全數有服務" : "實服多 " + Math.abs(gap) + " 案"}</span>`;
    }

    const card = document.createElement("div");
    card.className = "card";
    card.style.borderTopColor = color.border;
    card.innerHTML = `
      <div class="inst-name">${name}</div>
      <div class="metric-row">
        <div class="metric">
          <div class="m-val hold">${hold ?? "—"}</div>
          <div class="m-lab">掛案</div>
        </div>
        <div class="m-sep">/</div>
        <div class="metric">
          <div class="m-val" style="color:${color.border}">${serv ?? "—"}</div>
          <div class="m-lab">實服</div>
        </div>
      </div>
      <div class="chips">${gapHTML}${trendHTML}</div>`;
    container.appendChild(card);
  });
}

// ── 督導明細區塊 ─────────────────────────────────────────────────────────────
function renderSupervisors() {
  const container = document.getElementById("sup-container");
  container.innerHTML = "";
  if (!hasData) {
    container.innerHTML = `
      <div class="no-data-msg" style="grid-column:1/-1">
        <div class="icon">📋</div><p>尚無資料</p>
      </div>`;
    return;
  }

  const instNames  = Object.keys(latest.institutions);
  const supData    = latest.supervisors || {};
  const topColors  = Object.values(COLORS);

  instNames.forEach((instName, i) => {
    const color   = topColors[i] || { border: "#718096", bar: "#718096" };
    const sups    = supData[instName] || {};
    const servMap = servedSups(instName);

    // 正規化：每位督導值可能是數字（舊格式）或 {count, districts}（新格式）
    const entries = Object.entries(sups).map(([supName, val]) => {
      const base = (val && typeof val === "object")
        ? { name: supName, count: val.count ?? 0, districts: val.districts || null }
        : { name: supName, count: val ?? 0, districts: null };
      base.served = servMap ? (servMap[supName] ?? 0) : null;
      return base;
    });

    // 實服名單裡若出現掛案表沒有的督導（例如已離職／改派），補在最後
    if (servMap) {
      Object.entries(servMap).forEach(([supName, n]) => {
        if (!entries.some(e => e.name === supName)) {
          entries.push({ name: supName, count: 0, districts: null, served: n });
        }
      });
    }

    const maxVal = Math.max(...entries.map(e => Math.max(e.count, e.served ?? 0)), 1);

    let rows = `
      <tr class="thead-row">
        <td style="text-align:left">督導</td><td>掛案</td><td>實服</td><td></td>
      </tr>`;

    entries.forEach(({ name: supName, count: cnt, districts, served }) => {
      const holdPct = Math.round((cnt / maxVal) * 100);
      const servPct = served == null ? 0 : Math.round((served / maxVal) * 100);
      const hasDist = districts && Object.keys(districts).length > 0;
      const gap     = (served == null || cnt === 0) ? 0 : cnt - served;
      const gapBig  = served != null && cnt > 0 && (served === 0 || gap / cnt >= 0.2);
      const ico = hasDist
        ? `<span class="toggle-ico">▶</span>`
        : `<span class="toggle-ico" style="visibility:hidden">▶</span>`;
      const servTxt = served == null
        ? `<td class="c-served na">—</td>`
        : `<td class="c-served"${gapBig ? "" : ` style="color:${color.bar}"`}>${served}</td>`;
      rows += `
        <tr class="sup-row${hasDist ? " has-dist" : ""}${gapBig ? " gap-big" : ""}">
          <td><div class="sup-name-cell">${ico}<span>${supName}</span></div></td>
          <td class="c-hold">${cnt}</td>
          ${servTxt}
          <td class="bar-cell">
            <div class="bar-bg">
              <div class="bar-hold" style="width:${holdPct}%"></div>
              <div class="bar-served" style="width:${servPct}%;background:${color.bar}"></div>
            </div>
          </td>
        </tr>`;
      if (hasDist) {
        const chips = Object.entries(districts)
          .map(([d, n]) => `<span class="district-chip">${d}<b>${n}</b></span>`)
          .join("");
        rows += `
        <tr class="detail-row" style="display:none">
          <td colspan="4"><div class="district-list">${chips}</div></td>
        </tr>`;
      }
    });

    if (entries.length === 0) {
      rows += `<tr><td colspan="4" style="color:#a0aec0;font-size:11px;padding:8px 0">無資料</td></tr>`;
    }

    const card = document.createElement("div");
    card.className = "sup-card";
    card.style.borderTopColor = color.border;
    card.innerHTML = `
      <div class="inst-label">${instName}</div>
      <table class="sup-table">${rows}</table>`;
    container.appendChild(card);
  });

  // 點擊督導列 → 展開/收合該列下方的行政區明細
  container.querySelectorAll("tr.sup-row.has-dist").forEach(row => {
    row.addEventListener("click", () => {
      const detail = row.nextElementSibling;
      if (!detail || !detail.classList.contains("detail-row")) return;
      const isOpen = detail.style.display !== "none";
      detail.style.display = isOpen ? "none" : "";
      row.classList.toggle("open", !isOpen);
    });
  });
}

// ── 長條圖（掛案 vs 實服）────────────────────────────────────────────────────
let barChartInst = null;
function renderBarChart() {
  const ctx = document.getElementById("barChart");
  if (!ctx) return;
  if (!hasData) {
    ctx.parentElement.innerHTML = `<div class="no-data-msg"><div class="icon">📊</div><p>尚無資料</p></div>`;
    return;
  }
  if (typeof Chart === "undefined") {
    ctx.parentElement.innerHTML = `<div class="no-data-msg"><div class="icon">\u26a0\ufe0f</div><p>圖表元件未載入<br>上方數字仍可正常查看</p></div>`;
    return;
  }
  if (barChartInst) barChartInst.destroy();

  const cur      = latest.institutions;
  const labels   = Object.keys(cur);
  const holds    = labels.map(n => cur[n] ?? null);
  const serves   = labels.map(n => servedTotal(n));
  const colors   = labels.map((n, i) => BORDER_COLORS[i] || "#718096");

  barChartInst = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label: "掛案", data: holds,
          backgroundColor: HOLD_COLOR, borderColor: HOLD_COLOR,
          borderWidth: 0, borderRadius: 5, categoryPercentage: 0.7, barPercentage: 0.9 },
        { label: "實服（" + scopeLabel(MODE) + "）", data: serves,
          backgroundColor: colors, borderColor: colors,
          borderWidth: 0, borderRadius: 5, categoryPercentage: 0.7, barPercentage: 0.9 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "bottom", labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } },
        tooltip: { callbacks: {
          label: c => c.parsed.y == null
            ? ` ${c.dataset.label}：無資料`
            : ` ${c.dataset.label}：${c.parsed.y} 案`
        } }
      },
      scales: {
        y: { beginAtZero: true, grid: { color: "rgba(0,0,0,0.05)" }, ticks: { font: { size: 11 } } },
        x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 20 } }
      }
    }
  });
}

// ── 折線圖（掛案歷週趨勢）────────────────────────────────────────────────────
function renderLineChart() {
  const ctx = document.getElementById("lineChart");
  if (!hasData || history.length < 2) {
    ctx.parentElement.innerHTML = `<div class="no-data-msg"><div class="icon">📈</div><p>累積 2 週以上資料後<br>將顯示趨勢圖</p></div>`;
    return;
  }
  if (typeof Chart === "undefined") {
    ctx.parentElement.innerHTML = `<div class="no-data-msg"><div class="icon">\u26a0\ufe0f</div><p>圖表元件未載入<br>上方數字仍可正常查看</p></div>`;
    return;
  }
  const slice     = history.slice(0, 12).reverse();
  const labels    = slice.map(formatWeekLabel);
  const instNames = Object.keys(history[0].institutions);
  const colorList = Object.values(COLORS);

  const datasets = instNames.map((name, i) => ({
    label: name,
    data: slice.map(h => h.institutions[name] ?? null),
    borderColor: colorList[i]?.border || "#718096",
    backgroundColor: colorList[i]?.bg || "rgba(0,0,0,0.05)",
    borderWidth: 2, pointRadius: 4, pointHoverRadius: 6,
    tension: 0.3, fill: false, spanGaps: true,
  }));

  new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "bottom", labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${ctx.parsed.y} 筆` } }
      },
      scales: {
        y: { beginAtZero: false, grid: { color: "rgba(0,0,0,0.05)" }, ticks: { font: { size: 11 } } },
        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
      }
    }
  });
}

// ── 折線圖（合計趨勢：高雄 3 家 vs. 全部機構）────────────────────────────────
function renderTotalChart() {
  const ctx = document.getElementById("totalChart");
  if (!hasData || history.length < 2) {
    ctx.parentElement.innerHTML = `<div class="no-data-msg"><div class="icon">🏢</div><p>累積 2 週以上資料後<br>將顯示合計趨勢</p></div>`;
    return;
  }
  if (typeof Chart === "undefined") {
    ctx.parentElement.innerHTML = `<div class="no-data-msg"><div class="icon">\u26a0\ufe0f</div><p>圖表元件未載入<br>上方數字仍可正常查看</p></div>`;
    return;
  }
  const slice    = history.slice(0, 12).reverse();
  const labels   = slice.map(formatWeekLabel);
  const allNames = Object.keys(history[0].institutions);

  const base = { borderWidth: 2.5, pointRadius: 4, pointHoverRadius: 6,
                 tension: 0.3, fill: false, spanGaps: false };
  const datasets = [
    Object.assign({
      label: "高雄 3 家合計",
      data: slice.map(h => sumOrNull(h, KAOHSIUNG_INSTITUTIONS)),
      borderColor: "#c2185b", backgroundColor: "rgba(194,24,91,0.12)",
    }, base),
    Object.assign({
      label: `全部 ${allNames.length} 家合計`,
      data: slice.map(h => sumOrNull(h, allNames)),
      borderColor: "#37474f", backgroundColor: "rgba(55,71,79,0.12)",
    }, base),
  ];

  new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "bottom", labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } },
        tooltip: { callbacks: {
          label: c => c.parsed.y == null
            ? ` ${c.dataset.label}：資料不完整`
            : ` ${c.dataset.label}：${c.parsed.y} 筆`
        } }
      },
      scales: {
        y: { beginAtZero: false, grid: { color: "rgba(0,0,0,0.05)" }, ticks: { font: { size: 11 } } },
        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
      }
    }
  });
}

// ── 初始化 ────────────────────────────────────────────────────────────────────
function safe(fn) {
  try { fn(); } catch (e) { console.error(fn.name + " 失敗：", e); }
}
function renderAll() {
  // 先畫數字表，再畫圖；圖表函式庫載入失敗時數字仍看得到
  safe(renderCards);
  safe(renderSupervisors);
  safe(renderBarChart);
}
safe(setupSeg);
renderAll();
safe(renderLineChart);
safe(renderTotalChart);
</script>
</body>
